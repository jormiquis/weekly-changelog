<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Changelog</title>
  <meta property="og:title" content="Weekly Changelog">
  <meta property="og:image" content="card.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px 20px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 45%, #6d28d9 100%);
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 1200px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    footer a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="card.png" alt="Weekly changelog card">
  </div>
  <footer>
    How is this card generated? &middot; <a href="https://github.com/jormiquis/weekly-changelog">weekly-changelog</a>
  </footer>
</body>
</html>
