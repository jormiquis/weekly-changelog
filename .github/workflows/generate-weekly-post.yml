name: Generate weekly post

on:
  workflow_dispatch:

jobs:
  generate-weekly-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
      run: npm run build

      - name: Run weekly flow
        run: npm run weekly
        env:
          GITHUB_USERNAME: ${{ vars.USERNAME }}